name: Sync fork with upstream

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'HackXIt/appium-device-farm'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # Use a PAT with workflow scope so upstream changes under .github/workflows
          # can be synced. The default GITHUB_TOKEN cannot update workflow files.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          persist-credentials: true

      - name: Merge upstream main and tags
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/AppiumTestDistribution/appium-device-farm.git
          git fetch upstream main --tags

          before="$(git rev-parse HEAD)"
          git merge --no-edit -m "chore: sync upstream main [skip actions]" upstream/main
          after="$(git rev-parse HEAD)"

          if [ "$before" = "$after" ]; then
            echo "Fork main already contains upstream/main."
          else
            git push origin HEAD:main
          fi

          git push origin --tags
